services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-ai-seo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_ai_seo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d agent_ai_seo]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-vector-test:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    container_name: agent-ai-seo-postgres-vector-test
    profiles: [integration]
    environment:
      POSTGRES_DB: agent_ai_seo_integration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-vector-test-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d agent_ai_seo_integration]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  postgres-vector-test-data:
