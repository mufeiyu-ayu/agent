services:
  postgres:
    # 主库必须使用含 pgvector 的镜像：Article Embedding Index migration 会执行
    # CREATE EXTENSION vector，普通 postgres:16-alpine 缺扩展会直接失败。
    # 版本与下方 integration 测试库保持一致。
    # 注意：从旧 alpine 镜像迁移的已有数据卷存在 musl→glibc collation 差异，
    # 建议重置卷后重建（开发数据可由 seed / index 重建），见 README Getting started。
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    container_name: agent-ai-seo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_ai_seo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d agent_ai_seo]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-vector-test:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    container_name: agent-ai-seo-postgres-vector-test
    profiles: [integration]
    environment:
      POSTGRES_DB: agent_ai_seo_integration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-vector-test-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d agent_ai_seo_integration]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  postgres-vector-test-data:
