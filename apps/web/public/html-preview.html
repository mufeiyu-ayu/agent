<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'none'; worker-src 'none'; webrtc 'block'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; frame-src 'none'; base-uri 'none'; form-action 'none'">
    <style>html, body { margin: 0; height: 100%; overflow: hidden; } iframe { display: block; width: 100%; height: 100%; border: 0; }</style>
  </head>
  <body>
    <iframe title="HTML preview" sandbox="" referrerpolicy="no-referrer"></iframe>
    <script>
      // 只接收宿主的文档；生成页面不能通过消息改写这个隔离外层。
      window.addEventListener('message', (event) => {
        if (event.source !== window.parent || event.data?.type !== 'html-preview'
          || typeof event.data.code !== 'string' || typeof event.data.title !== 'string') return;
        const frame = document.querySelector('iframe');
        frame.title = event.data.title;
        const interactive = event.data.interactive === true;
        frame.setAttribute('sandbox', interactive ? 'allow-scripts' : '');
        // 静态预览不执行用户脚本，也不保留网络预取和嵌套文档入口；下载仍使用原文。
        const parsed = new DOMParser().parseFromString(event.data.code, 'text/html');
        parsed.querySelectorAll(interactive ? 'script[src], link, meta[http-equiv], template, iframe, frame, object, embed' : 'script, link, meta[http-equiv], template, iframe, frame, object, embed')
          .forEach(element => element.remove());
        if (interactive) {
          const bridge = parsed.createElement('script');
          bridge.textContent = `(()=>{for(const name of ['RTCPeerConnection','webkitRTCPeerConnection','mozRTCPeerConnection','Worker','SharedWorker']){Object.defineProperty(window,name,{value:undefined,writable:false,configurable:false})}const pending=new Map();window.kuro={query:(query)=>new Promise((resolve,reject)=>{if(query!=='topuplist.traffic'||pending.size>=4){reject(new Error('不支持的查询'));return}const id=crypto.randomUUID?.()??'q'+Date.now()+Math.random().toString(36).slice(2);const timer=setTimeout(()=>{pending.delete(id);reject(new Error('查询超时'))},10000);pending.set(id,{resolve,reject,timer});parent.postMessage({type:'workspace-query',id,query},'*')})};addEventListener('keydown',event=>{if(event.key==='Escape')parent.postMessage({type:'html-preview-close'},'*')},true);addEventListener('message',event=>{if(event.source!==parent||event.data?.type!=='workspace-query-result')return;const item=pending.get(event.data.id);if(!item)return;clearTimeout(item.timer);pending.delete(event.data.id);event.data.error?item.reject(new Error(event.data.error)):item.resolve(event.data.result)})})();`;
          parsed.head.prepend(bridge);
        }
        frame.srcdoc = '<!doctype html>' + parsed.documentElement.outerHTML;
      });
      window.addEventListener('message', event => {
        const frame = document.querySelector('iframe');
        if (event.source === frame.contentWindow && event.origin === 'null' && event.data?.type === 'html-preview-close')
          window.parent.postMessage({ type: 'html-preview-close' }, '*');
        if (event.source === frame.contentWindow && event.origin === 'null' && event.data?.type === 'workspace-query'
          && event.data.query === 'topuplist.traffic' && typeof event.data.id === 'string' && /^[\w-]{1,80}$/.test(event.data.id))
          window.parent.postMessage(event.data, '*');
        if (event.source === window.parent && event.data?.type === 'workspace-query-result')
          frame.contentWindow?.postMessage(event.data, '*');
      });
    </script>
  </body>
</html>
