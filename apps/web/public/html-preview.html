<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; frame-src 'none'; base-uri 'none'; form-action 'none'">
    <style>html, body { margin: 0; height: 100%; overflow: hidden; } iframe { display: block; width: 100%; height: 100%; border: 0; }</style>
  </head>
  <body>
    <iframe title="HTML preview" sandbox="" referrerpolicy="no-referrer"></iframe>
    <script>
      // 只接收宿主的文档；生成页面不能通过消息改写这个隔离外层。
      window.addEventListener('message', (event) => {
        if (event.source !== window.parent || event.data?.type !== 'html-preview'
          || typeof event.data.code !== 'string' || typeof event.data.title !== 'string') return;
        const frame = document.querySelector('iframe');
        frame.title = event.data.title;
        // 静态预览不执行用户脚本，也不保留网络预取和嵌套文档入口；下载仍使用原文。
        const parsed = new DOMParser().parseFromString(event.data.code, 'text/html');
        parsed.querySelectorAll('script, link, meta[http-equiv], template, iframe, frame, object, embed')
          .forEach(element => element.remove());
        frame.srcdoc = '<!doctype html>' + parsed.documentElement.outerHTML;
      });
    </script>
  </body>
</html>
